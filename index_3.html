<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Vitrina — catálogo online multi-loja com pedidos via WhatsApp. Cada loja tem sua própria conta, seus produtos e seu link público.">
<title>Vitrina — Catálogo Online com Pedidos via WhatsApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  /* ============ TOKENS ============ */
  :root{
    --bg:#F5F8F6;
    --surface:#FFFFFF;
    --surface-alt:#EAF1EC;
    --surface-raised:#FFFFFF;
    --border:#DCE6DF;
    --border-strong:#C3D2C8;
    --text:#101A16;
    --text-muted:#5B6D64;
    --text-faint:#8B9A92;
    --accent:#0F6B5C;
    --accent-strong:#0B5347;
    --accent-soft:#DEEEE9;
    --accent-2:#E8622C;
    --accent-2-strong:#C94F1E;
    --accent-2-soft:#FCE4D7;
    --success:#2F9E44;
    --success-soft:#E1F5E4;
    --warning:#B4780F;
    --warning-soft:#FBEBD2;
    --danger:#DC3545;
    --danger-soft:#FBE1E3;
    --shadow-sm:0 1px 2px rgba(16,26,22,.06), 0 1px 1px rgba(16,26,22,.04);
    --shadow-md:0 6px 20px rgba(16,26,22,.08), 0 2px 6px rgba(16,26,22,.05);
    --shadow-lg:0 20px 45px rgba(16,26,22,.16), 0 6px 16px rgba(16,26,22,.08);
    --radius-sm:8px;
    --radius-md:14px;
    --radius-lg:22px;
    --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0B1210;
      --surface:#121B18;
      --surface-alt:#182420;
      --surface-raised:#182420;
      --border:#25332C;
      --border-strong:#324339;
      --text:#EDF3F0;
      --text-muted:#9FB0A8;
      --text-faint:#748179;
      --accent:#2BB39A;
      --accent-strong:#4FCBB3;
      --accent-soft:#17332D;
      --accent-2:#FF8259;
      --accent-2-strong:#FFA085;
      --accent-2-soft:#3A2419;
      --success:#4CC463;
      --success-soft:#173423;
      --warning:#F0A93B;
      --warning-soft:#3A2C12;
      --danger:#FF6B6B;
      --danger-soft:#3A1C1E;
      --shadow-sm:0 1px 2px rgba(0,0,0,.35);
      --shadow-md:0 6px 20px rgba(0,0,0,.4);
      --shadow-lg:0 20px 45px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0B1210;
    --surface:#121B18;
    --surface-alt:#182420;
    --surface-raised:#182420;
    --border:#25332C;
    --border-strong:#324339;
    --text:#EDF3F0;
    --text-muted:#9FB0A8;
    --text-faint:#748179;
    --accent:#2BB39A;
    --accent-strong:#4FCBB3;
    --accent-soft:#17332D;
    --accent-2:#FF8259;
    --accent-2-strong:#FFA085;
    --accent-2-soft:#3A2419;
    --success:#4CC463;
    --success-soft:#173423;
    --warning:#F0A93B;
    --warning-soft:#3A2C12;
    --danger:#FF6B6B;
    --danger-soft:#3A1C1E;
    --shadow-sm:0 1px 2px rgba(0,0,0,.35);
    --shadow-md:0 6px 20px rgba(0,0,0,.4);
    --shadow-lg:0 20px 45px rgba(0,0,0,.55);
  }

  *,*::before,*::after{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    font-size:15.5px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{min-height:100vh;display:flex;flex-direction:column;}
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}
  h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;text-wrap:balance;margin:0;color:var(--text);}
  p{margin:0;}
  ul{margin:0;padding:0;list-style:none;}
  input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:.65em .8em;width:100%;transition:border-color .15s ease, box-shadow .15s ease;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  input[type="color"]{padding:.25em;height:44px;cursor:pointer;}
  label{font-size:.82rem;font-weight:600;color:var(--text-muted);display:block;margin-bottom:.4em;letter-spacing:.01em;}
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;}
  ::selection{background:var(--accent-soft);color:var(--accent-strong);}
  .tnum{font-variant-numeric:tabular-nums;}
  .mono{font-family:var(--font-mono);}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
  }

  /* ============ LAYOUT PRIMITIVES ============ */
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:.5em;
    border:1.5px solid transparent;border-radius:999px;padding:.75em 1.4em;
    font-weight:600;font-size:.92rem;cursor:pointer;transition:transform .12s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
    white-space:nowrap;
  }
  .btn:active{transform:translateY(1px) scale(.99);}
  .btn-primary{background:var(--accent);color:#fff;box-shadow:var(--shadow-sm);}
  .btn-primary:hover{background:var(--accent-strong);box-shadow:var(--shadow-md);}
  .btn-accent2{background:var(--accent-2);color:#fff;}
  .btn-accent2:hover{background:var(--accent-2-strong);}
  .btn-outline{background:transparent;border-color:var(--border-strong);color:var(--text);}
  .btn-outline:hover{border-color:var(--accent);color:var(--accent-strong);}
  .btn-ghost{background:transparent;color:var(--text-muted);}
  .btn-ghost:hover{background:var(--surface-alt);color:var(--text);}
  .btn-sm{padding:.45em .9em;font-size:.82rem;}
  .btn-danger-outline{background:transparent;border-color:var(--danger);color:var(--danger);}
  .btn-danger-outline:hover{background:var(--danger-soft);}
  .btn-block{width:100%;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .icon-btn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--border-strong);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.05rem;transition:border-color .15s, background .15s;flex-shrink:0;}
  .icon-btn:hover{border-color:var(--accent);background:var(--accent-soft);}
  .icon-btn.is-active{background:var(--accent-2-soft);border-color:var(--accent-2);color:var(--accent-2-strong);}

  .badge{display:inline-flex;align-items:center;gap:.35em;font-size:.72rem;font-weight:700;letter-spacing:.02em;padding:.32em .7em;border-radius:999px;text-transform:uppercase;}
  .badge-success{background:var(--success-soft);color:var(--success);}
  .badge-danger{background:var(--danger-soft);color:var(--danger);}
  .badge-warning{background:var(--warning-soft);color:var(--warning);}
  .badge-accent{background:var(--accent-soft);color:var(--accent-strong);}
  .badge-accent2{background:var(--accent-2-soft);color:var(--accent-2-strong);}
  .badge-neutral{background:var(--surface-alt);color:var(--text-muted);}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);}
  .skeleton{background:linear-gradient(100deg, var(--surface-alt) 30%, var(--border) 50%, var(--surface-alt) 70%);background-size:200% 100%;animation:shimmer 1.3s ease-in-out infinite;border-radius:var(--radius-md);}
  @keyframes shimmer{0%{background-position:150% 0;}100%{background-position:-50% 0;}}

  /* ============ TOASTS ============ */
  .toast-root{position:fixed;top:16px;right:16px;z-index:900;display:flex;flex-direction:column;gap:10px;max-width:min(360px,calc(100vw - 32px));}
  .toast{background:var(--text);color:var(--bg);padding:.85em 1.1em;border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);font-size:.87rem;font-weight:500;display:flex;align-items:center;gap:.6em;animation:toast-in .25s ease;}
  .toast.success{background:var(--success);color:#fff;}
  .toast.error{background:var(--danger);color:#fff;}
  .toast.info{background:var(--accent-strong);color:#fff;}
  @keyframes toast-in{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
  .toast.leaving{animation:toast-out .2s ease forwards;}
  @keyframes toast-out{to{opacity:0;transform:translateX(20px);}}

  /* ============ PRODUCT THUMB PLACEHOLDER ============ */
  .thumb{position:relative;border-radius:var(--radius-md) var(--radius-md) 0 0;overflow:hidden;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:2.6rem;color:rgba(255,255,255,.92);}
  .thumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
  .thumb-sm{border-radius:var(--radius-sm);font-size:1.3rem;}
  .g0{background:linear-gradient(135deg,#0F6B5C,#1F8E7A);}
  .g1{background:linear-gradient(135deg,#E8622C,#F3A15C);}
  .g2{background:linear-gradient(135deg,#8A5CBF,#B98CE0);}
  .g3{background:linear-gradient(135deg,#B4780F,#E0A83F);}
  .g4{background:linear-gradient(135deg,#2F6FA6,#5FA6D9);}
  .g5{background:linear-gradient(135deg,#B4394E,#DB6C7F);}

  /* ============ HEADER (STORE) ============ */
  .store-header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:80;}
  .store-header-top{display:flex;align-items:center;gap:16px;padding:14px 0;}
  .store-logo{width:52px;height:52px;border-radius:14px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:1.3rem;flex-shrink:0;box-shadow:var(--shadow-sm);}
  .store-id{flex:1;min-width:0;}
  .store-id h1{font-size:1.28rem;line-height:1.15;}
  .store-id p{font-size:.83rem;color:var(--text-muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .store-header-actions{display:flex;align-items:center;gap:8px;}
  .cart-fab{position:relative;}
  .cart-count{position:absolute;top:-4px;right:-4px;background:var(--accent-2);color:#fff;font-size:.68rem;font-weight:700;min-width:18px;height:18px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--surface);}
  .store-banner{background:var(--accent-soft);color:var(--accent-strong);font-size:.85rem;font-weight:600;text-align:center;padding:.55em 1em;}
  .store-search-row{display:flex;gap:10px;padding:12px 0;flex-wrap:wrap;}
  .search-box{position:relative;flex:1;min-width:200px;}
  .search-box input{padding-left:2.4em;}
  .search-box .si{position:absolute;left:.85em;top:50%;transform:translateY(-50%);color:var(--text-faint);}
  .cat-scroll{display:flex;gap:8px;overflow-x:auto;padding:0 0 14px;scrollbar-width:none;}
  .cat-scroll::-webkit-scrollbar{display:none;}
  .cat-chip{flex-shrink:0;display:flex;align-items:center;gap:.4em;padding:.5em 1em;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);font-size:.85rem;font-weight:600;color:var(--text-muted);cursor:pointer;transition:all .15s;}
  .cat-chip:hover{border-color:var(--accent);}
  .cat-chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  /* ============ HERO / PLATFORM LANDING ============ */
  .plat-nav{display:flex;align-items:center;justify-content:space-between;padding:20px 0;}
  .plat-brand{display:flex;align-items:center;gap:.6em;font-family:var(--font-display);font-weight:700;font-size:1.3rem;}
  .plat-brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent-2);}
  .plat-hero{padding:56px 0 40px;display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:center;}
  .plat-hero h1{font-size:clamp(2.1rem,4.2vw,3.4rem);line-height:1.08;letter-spacing:-.01em;}
  .plat-hero .accent-word{color:var(--accent);}
  .plat-hero p.lead{font-size:1.08rem;color:var(--text-muted);margin-top:18px;max-width:46ch;}
  .plat-hero-actions{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;}
  .plat-stats{display:flex;gap:28px;margin-top:38px;flex-wrap:wrap;}
  .plat-stats div b{display:block;font-family:var(--font-display);font-size:1.5rem;color:var(--text);}
  .plat-stats div span{font-size:.78rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;}
  .phone-mock{background:var(--text);border-radius:36px;padding:14px;box-shadow:var(--shadow-lg);max-width:300px;margin:0 auto;}
  .phone-screen{background:var(--bg);border-radius:24px;overflow:hidden;min-height:480px;display:flex;flex-direction:column;}
  .wa-bubble-wrap{background:#0b1a12;flex:1;padding:16px 12px;display:flex;flex-direction:column;justify-content:flex-end;}
  .wa-bubble{background:#DCF3D0;color:#0b1a12;border-radius:12px 12px 12px 2px;padding:12px 14px;font-size:.74rem;line-height:1.5;box-shadow:var(--shadow-sm);animation:pop-in .5s ease both;}
  @keyframes pop-in{from{opacity:0;transform:translateY(10px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
  .plat-section{padding:44px 0;}
  .plat-section h2{font-size:1.7rem;margin-bottom:10px;}
  .plat-section .sub{color:var(--text-muted);max-width:60ch;margin-bottom:28px;}
  .feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  .feat-card{padding:24px;border-radius:var(--radius-md);background:var(--surface);border:1px solid var(--border);}
  .feat-card .fi{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent-strong);display:flex;align-items:center;justify-content:center;font-size:1.3rem;margin-bottom:14px;}
  .feat-card h3{font-size:1.02rem;margin-bottom:6px;}
  .feat-card p{font-size:.87rem;color:var(--text-muted);}
  .steps-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;counter-reset:step;}
  .step-card{position:relative;padding:20px 18px 18px;border-radius:var(--radius-md);background:var(--surface-alt);}
  .step-card .sn{font-family:var(--font-display);font-weight:700;font-size:1.6rem;color:var(--accent);}
  .step-card h4{font-size:.92rem;margin:8px 0 4px;}
  .step-card p{font-size:.82rem;color:var(--text-muted);}
  .plat-cta{background:var(--accent);color:#fff;border-radius:var(--radius-lg);padding:44px;text-align:center;margin:20px 0 56px;}
  .plat-cta h2{color:#fff;}
  .plat-cta p{color:rgba(255,255,255,.85);margin:10px 0 22px;}
  .plat-footer{border-top:1px solid var(--border);padding:26px 0;color:var(--text-faint);font-size:.82rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;}

  /* ============ CATALOG ============ */
  .catalog-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 0 6px;flex-wrap:wrap;}
  .catalog-toolbar h2{font-size:1.15rem;}
  .toolbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  select.sort-select{width:auto;padding:.5em .75em;font-size:.82rem;}
  .product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding:16px 0 48px;}
  .product-card{display:flex;flex-direction:column;overflow:hidden;transition:box-shadow .2s ease, transform .2s ease;position:relative;}
  .product-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
  .thumb-tags{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:6px;z-index:2;}
  .fav-btn{position:absolute;top:10px;right:10px;z-index:2;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;box-shadow:var(--shadow-sm);}
  .fav-btn.is-fav{color:var(--accent-2);}
  .pc-body{padding:14px 14px 16px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .pc-cat{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);}
  .pc-name{font-size:.95rem;font-weight:600;line-height:1.3;min-height:2.5em;}
  .pc-desc{font-size:.79rem;color:var(--text-muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .pc-price-row{display:flex;align-items:baseline;gap:.5em;margin-top:2px;}
  .pc-price{font-family:var(--font-display);font-weight:600;font-size:1.15rem;}
  .pc-price-old{font-size:.78rem;color:var(--text-faint);text-decoration:line-through;}
  .pc-stock{font-size:.74rem;color:var(--text-faint);}
  .pc-actions{display:flex;gap:8px;margin-top:8px;}
  .empty-state{text-align:center;padding:70px 20px;color:var(--text-muted);}
  .empty-state .ei{font-size:2.4rem;margin-bottom:10px;}

  /* ============ PRODUCT DETAIL ============ */
  .breadcrumb{font-size:.8rem;color:var(--text-faint);padding:16px 0 4px;display:flex;gap:6px;flex-wrap:wrap;}
  .breadcrumb a:hover{color:var(--accent);}
  .pd-grid{display:grid;grid-template-columns:1fr 1fr;gap:44px;padding:20px 0 40px;}
  .pd-gallery-main{border-radius:var(--radius-lg);overflow:hidden;aspect-ratio:1/1;font-size:5rem;}
  .pd-gallery-thumbs{display:flex;gap:8px;margin-top:10px;}
  .pd-gallery-thumbs .thumb{width:64px;height:64px;border-radius:10px;font-size:1.4rem;cursor:pointer;border:2px solid transparent;}
  .pd-gallery-thumbs .thumb.active{border-color:var(--accent);}
  .pd-info h1{font-size:1.7rem;margin-bottom:4px;}
  .pd-meta{display:flex;gap:10px;align-items:center;color:var(--text-faint);font-size:.82rem;margin-bottom:14px;flex-wrap:wrap;}
  .pd-price-block{display:flex;align-items:baseline;gap:.6em;margin:14px 0;}
  .pd-price{font-family:var(--font-display);font-size:2rem;font-weight:600;color:var(--accent-strong);}
  .pd-price-old{font-size:1rem;color:var(--text-faint);text-decoration:line-through;}
  .pd-desc{color:var(--text-muted);font-size:.94rem;line-height:1.65;margin:16px 0;}
  .qty-picker{display:flex;align-items:center;border:1.5px solid var(--border-strong);border-radius:999px;width:fit-content;}
  .qty-picker button{width:40px;height:40px;border:none;background:transparent;font-size:1.1rem;cursor:pointer;border-radius:999px;}
  .qty-picker button:hover{background:var(--surface-alt);}
  .qty-picker input{width:48px;border:none;text-align:center;padding:0;background:transparent;}
  .pd-actions{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap;}
  .unavailable-banner{background:var(--danger-soft);color:var(--danger);font-weight:700;padding:.8em 1.1em;border-radius:var(--radius-sm);margin:14px 0;display:flex;align-items:center;gap:.5em;}
  .related-title{font-size:1.1rem;margin:36px 0 14px;}

  /* ============ CART ============ */
  .cart-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:32px;padding:20px 0 60px;align-items:start;}
  .cart-line{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--border);}
  .cart-line .thumb{width:76px;height:76px;flex-shrink:0;border-radius:var(--radius-sm);font-size:1.6rem;}
  .cart-line-body{flex:1;min-width:0;}
  .cart-line-title{font-weight:600;font-size:.95rem;}
  .cart-line-cat{font-size:.76rem;color:var(--text-faint);margin-top:2px;}
  .cart-line-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px;flex-wrap:wrap;}
  .cart-line-price{font-size:.85rem;color:var(--text-muted);}
  .cart-line-sub{font-weight:700;font-family:var(--font-mono);font-size:.92rem;}
  .cart-summary{position:sticky;top:90px;padding:22px;}
  .summary-row{display:flex;justify-content:space-between;font-size:.9rem;padding:6px 0;color:var(--text-muted);}
  .summary-total{display:flex;justify-content:space-between;font-size:1.2rem;font-weight:700;padding-top:12px;margin-top:8px;border-top:1px solid var(--border);}
  .field-group{margin-top:14px;}
  textarea{resize:vertical;min-height:70px;}
  .radio-row{display:flex;gap:10px;flex-wrap:wrap;}

<script>
'use strict';
/* ======================================================================
   VITRINA — catálogo online multi-loja com pedidos via WhatsApp
   Versão real: Supabase (Auth + Postgres + Storage). Cada loja tem sua
   própria conta, seu catálogo público (/#/loja/:slug) e seus dados
   isolados por Row Level Security no banco.
   ====================================================================== */

/* ---------------- CONFIGURAÇÃO SUPABASE ---------------- */
const SUPABASE_URL = 'https://imorlnqujkjzdwllsitu.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imltb3JsbnF1amtqemR3bGxzaXR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NzU5ODgsImV4cCI6MjEwMzE1MTk4OH0.R6lSncKlkiPqgTZhCQhWBVTvszGxbRQlsGP8I3GkY9U';
const BUCKET = 'product-images';
let sb = null;
let SUPABASE_READY = false;
try{
  if(window.supabase && window.supabase.createClient){
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
    SUPABASE_READY = true;
  }
}catch(e){ console.error('Falha ao iniciar Supabase:', e); }

/* ---------------- ESTADO EM MEMÓRIA (por aba) ---------------- */
let SESSION = null;      // sessão de auth atual (ou null)
let MY_STORE = null;     // linha da tabela stores do usuário logado
let PUBLIC_STORE = null; // loja carregada para visita pública (por slug)
let PUBLIC_CATS = [];
let PUBLIC_PRODS = [];
let ADMIN_CATS = [];
let ADMIN_PRODS = [];
let ADMIN_ORDERS = [];
let ADMIN_EVENTS = [];
let formDraftImages = []; // imagens (URLs já enviadas) do produto em edição
let formDraftUploading = false;

const GRADS = ['g0','g1','g2','g3','g4','g5'];
function hashStr(s){ let h=0; for(let i=0;i<String(s).length;i++){h=(h*31+String(s).charCodeAt(i))|0;} return Math.abs(h); }
function gradFor(seed){ return GRADS[hashStr(seed)%GRADS.length]; }

/* ---------------- UTILITÁRIOS ---------------- */
function fmtBRL(v){ return (Number(v)||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'}); }
function fmtDate(iso){ const d=new Date(iso); return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit', year:'numeric'}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function $(sel, root){ return (root||document).querySelector(sel); }
function $all(sel, root){ return Array.from((root||document).querySelectorAll(sel)); }
function effPrice(p){ return p.promo_price!=null ? Number(p.promo_price) : Number(p.price); }
function catIcon(cats, categoryId){ const c=cats.find(x=>x.id===categoryId); return c?c.icon:'📦'; }
function catName(cats, categoryId){ const c=cats.find(x=>x.id===categoryId); return c?c.name:''; }

function thumbHtml(p, size){
  const cls = 'thumb ' + (size||'') + ' ' + gradFor(p.id||p.name||'x');
  const img = (p.images && p.images[0]) ? `<img src="${esc(p.images[0])}" alt="${esc(p.name)}">` : '';
  return `<div class="${cls}">${img}<span>${img?'':'📦'}</span></div>`;
}

function slugify(s){
  return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'')
    .toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-+|-+$)/g,'') || 'loja';
}

let toastSeq = 0;
function toast(msg, type){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast ' + (type||'');
  el.id = 'toast-'+(toastSeq++);
  const icon = type==='success' ? '✓' : type==='error' ? '✕' : 'ℹ';
  el.innerHTML = `<span>${icon}</span><span>${esc(msg)}</span>`;
  root.appendChild(el);
  setTimeout(()=>{ el.classList.add('leaving'); setTimeout(()=>el.remove(), 220); }, 3200);
}

function friendlyError(err){
  const msg = (err && err.message) || String(err||'');
  if(/already registered|already been registered/i.test(msg)) return 'Já existe uma conta com esse e-mail. Tente entrar, ou use "Esqueci minha senha".';
  if(/Invalid login credentials/i.test(msg)) return 'E-mail ou senha incorretos.';
  if(/Password should be at least/i.test(msg)) return 'A senha precisa ter pelo menos 6 caracteres.';
  if(/duplicate key.*slug/i.test(msg)) return 'Esse endereço de loja já está em uso — tente um nome um pouco diferente.';
  if(/Failed to fetch|NetworkError|network/i.test(msg)) return 'Não consegui conectar ao servidor. Verifique sua internet e tente de novo.';
  return msg || 'Algo deu errado. Tente novamente.';
}

function shadeColor(hex, percent){
  hex = String(hex||'#0F6B5C').replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex,16)||0;
  let r=(num>>16), g=(num>>8&0x00FF), b=(num&0x0000FF);
  const t = percent<0 ? 0 : 255;
  const p = Math.abs(percent)/100;
  r = Math.round((t-r)*p)+r; g=Math.round((t-g)*p)+g; b=Math.round((t-b)*p)+b;
  return '#' + (0x1000000 + Math.max(0,Math.min(255,r))*0x10000 + Math.max(0,Math.min(255,g))*0x100 + Math.max(0,Math.min(255,b))).toString(16).slice(1);
}
function applyBrandColors(primary, secondary){
  const root = document.documentElement.style;
  root.setProperty('--accent', primary||'#0F6B5C');
  root.setProperty('--accent-strong', shadeColor(primary||'#0F6B5C', -14));
  root.setProperty('--accent-soft', shadeColor(primary||'#0F6B5C', 86));
  root.setProperty('--accent-2', secondary||'#E8622C');
  root.setProperty('--accent-2-strong', shadeColor(secondary||'#E8622C', -14));
  root.setProperty('--accent-2-soft', shadeColor(secondary||'#E8622C', 86));
}
function resetBrandColors(){ applyBrandColors('#0F6B5C', '#E8622C'); }

/* ---------------- CAMADA DE DADOS (Supabase) ---------------- */
async function dbGetStoreBySlug(slug){
  const {data, error} = await sb.from('stores').select('*').eq('slug', slug).maybeSingle();
  if(error) throw error;
  return data;
}
async function dbGetMyStore(userId){
  const {data, error} = await sb.from('stores').select('*').eq('user_id', userId).maybeSingle();
  if(error) throw error;
  return data;
}
async function dbSlugAvailable(slug){
  const {data, error} = await sb.from('stores').select('id').eq('slug', slug).maybeSingle();
  if(error) throw error;
  return !data;
}
async function dbCreateStore(fields){
  const {data, error} = await sb.from('stores').insert(fields).select().single();
  if(error) throw error;
  return data;
}
async function dbUpdateStore(storeId, patch){
  const {data, error} = await sb.from('stores').update(patch).eq('id', storeId).select().single();
  if(error) throw error;
  return data;
}
async function dbGetCategories(storeId){
  const {data, error} = await sb.from('categories').select('*').eq('store_id', storeId).order('sort_order');
  if(error) throw error;
  return data||[];
}
async function dbCreateCategory(storeId, name, icon, sortOrder){
  const {data, error} = await sb.from('categories').insert({store_id:storeId, name, icon, sort_order:sortOrder}).select().single();
  if(error) throw error;
  return data;
}
async function dbUpdateCategory(id, patch){
  const {error} = await sb.from('categories').update(patch).eq('id', id);
  if(error) throw error;
}
async function dbDeleteCategory(id){
  const {error} = await sb.from('categories').delete().eq('id', id);
  if(error) throw error;
}
async function dbGetProducts(storeId){
  const {data, error} = await sb.from('products').select('*').eq('store_id', storeId).order('sort_order');
  if(error) throw error;
  return data||[];
}
async function dbCreateProduct(fields){
  const {data, error} = await sb.from('products').insert(fields).select().single();
  if(error) throw error;
  return data;
}
async function dbUpdateProduct(id, patch){
  patch.updated_at = new Date().toISOString();
  const {data, error} = await sb.from('products').update(patch).eq('id', id).select().single();
  if(error) throw error;
  return data;
}
async function dbDeleteProduct(id){
  const {error} = await sb.from('products').delete().eq('id', id);
  if(error) throw error;
}
async function dbGetOrders(storeId){
  const {data, error} = await sb.from('orders').select('*').eq('store_id', storeId).order('created_at', {ascending:false}).limit(200);
  if(error) throw error;
  return data||[];
}
async function dbCreateOrder(fields){
  const {error} = await sb.from('orders').insert(fields);
  if(error) throw error;
}
async function dbGetEvents(storeId){
  const {data, error} = await sb.from('store_events').select('*').eq('store_id', storeId).order('created_at', {ascending:false}).limit(2000);
  if(error) throw error;
  return data||[];
}
async function dbLogEvent(storeId, eventType, productId){
  try{ await sb.from('store_events').insert({store_id:storeId, event_type:eventType, product_id:productId||null}); }
  catch(e){ /* eventos não são críticos: nunca travar a navegação por causa disso */ }
}
async function dbUploadImage(userId, file){
  const ext = (file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
  const path = `${userId}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const {error} = await sb.storage.from(BUCKET).upload(path, file, {cacheControl:'3600', upsert:false});
  if(error) throw error;
  const {data} = sb.storage.from(BUCKET).getPublicUrl(path);

/* ---------------- CARRINHO (por loja, local ao navegador do cliente) ---------------- */
function cartKey(slug){ return 'vitrina_cart_'+slug; }
function getCart(slug){ try{ return JSON.parse(localStorage.getItem(cartKey(slug))||'[]'); }catch(e){ return []; } }
function setCart(slug, cart){ try{ localStorage.setItem(cartKey(slug), JSON.stringify(cart)); }catch(e){} }
function cartCount(slug){ return getCart(slug).reduce((s,l)=>s+l.qty,0); }
function cartTotal(slug, prods){
  const cart = getCart(slug);
  return cart.reduce((s,l)=>{ const p=prods.find(x=>x.id===l.id); return p? s+effPrice(p)*l.qty : s; },0);
}
function addToCart(slug, prods, id, qty){
  const p = prods.find(x=>x.id===id);
  if(!p || p.hidden || p.stock<=0){ toast('Este produto não está disponível.', 'error'); return; }
  const cart = getCart(slug);
  const line = cart.find(l=>l.id===id);
  const maxQty = p.stock>90 ? 9999 : p.stock;
  if(line) line.qty = Math.min(line.qty+(qty||1), maxQty);
  else cart.push({id, qty: Math.min(qty||1, maxQty)});
  setCart(slug, cart);
  dbLogEvent(PUBLIC_STORE.id, 'cart_add', id);
  toast(`"${p.name}" adicionado ao carrinho`, 'success');
  renderCartBadge(slug);
}
function setCartQty(slug, prods, id, qty){
  const p = prods.find(x=>x.id===id);
  const cart = getCart(slug);
  const line = cart.find(l=>l.id===id);
  if(!line) return;
  const maxQty = p && p.stock>90 ? 9999 : (p?p.stock:99);
  line.qty = Math.max(1, Math.min(qty, maxQty));
  setCart(slug, cart);
}
function removeFromCart(slug, id){ setCart(slug, getCart(slug).filter(l=>l.id!==id)); }
function clearCart(slug){ setCart(slug, []); }
function renderCartBadge(slug){
  const b = document.getElementById('cart-badge');
  if(!b) return;
  const n = cartCount(slug);
  b.textContent = n;
  b.style.display = n>0 ? 'flex' : 'none';
}

/* favoritos (por loja, local ao navegador do cliente) */
function favKey(slug){ return 'vitrina_fav_'+slug; }
function getFavs(slug){ try{ return JSON.parse(localStorage.getItem(favKey(slug))||'[]'); }catch(e){ return []; } }
function isFav(slug, id){ return getFavs(slug).includes(id); }
function toggleFav(slug, id){
  let favs = getFavs(slug);
  if(favs.includes(id)) favs = favs.filter(f=>f!==id); else favs.push(id);
  try{ localStorage.setItem(favKey(slug), JSON.stringify(favs)); }catch(e){}
}

/* ---------------- MENSAGEM WHATSAPP ---------------- */
function buildWhatsAppMessage(store, prods, cart, customerName, delivery, notes){
  const lines = [];
  lines.push('Olá! Gostaria de realizar o seguinte pedido:');
  lines.push('');
  lines.push(`🛍️ *Pedido realizado pelo ${store.name}*`);
  lines.push('');
  lines.push(`Cliente: ${customerName || 'Não informado'}`);
  lines.push('');
  lines.push('Produtos:');
  cart.forEach((l,i)=>{
    const p = prods.find(x=>x.id===l.id);
    if(!p) return;
    const unit = effPrice(p);
    lines.push(`${i+1}. ${p.name}`);
    lines.push(`   Quantidade: ${l.qty}`);
    lines.push(`   Valor unitário: ${fmtBRL(unit)}`);
    lines.push(`   Subtotal: ${fmtBRL(unit*l.qty)}`);
  });
  lines.push('');
  lines.push(`💰 *Valor total do pedido:* ${fmtBRL(cartTotal(store.slug, prods))}`);
  lines.push(`Forma de recebimento: ${delivery || 'Não informado'}`);
  lines.push(`Observações: ${notes && notes.trim() ? notes.trim() : 'Nenhuma observação.'}`);
  return lines.join('\n');
}

const ROUTES = [
  {re:/^\/$/, fn:()=>viewPlatform()},
  {re:/^\/loja\/([^\/]+)$/, fn:m=>viewCatalogLoading(m[1], 'all')},

];

function adminGuardSession(fn){
  return function(m){
    if(!SESSION){ navigate('/admin/login'); return; }
    fn(m);
  };
}
function adminGuard(fn){
  return function(m){
    if(!SESSION){ navigate('/admin/login'); return; }
    if(!MY_STORE){ navigate('/admin/completar-cadastro'); return; }
    fn(m);
  };
}

let routing = false;
async function render(){
  if(routing) return; // evita corrida entre navegações rápidas
  routing = true;
  try{
    const path = currentPath();
    if(/access_token=|type=recovery/.test(path)) { routing=false; return; } // aguarda o evento de auth
    window.scrollTo(0,0);
    for(const r of ROUTES){
      const m = path.match(r.re);
      if(m){ await r.fn(m); return; }
    }
    view404();
  }catch(e){
    console.error(e);
    mount(`<div class="wrap" style="padding:80px 0;text-align:center;"><h2>Ops, algo deu errado</h2><p style="color:var(--text-muted);margin:12px 0;">${esc(friendlyError(e))}</p><a class="btn btn-primary" href="#/">Voltar ao início</a></div>`);
  }finally{
    routing = false;
  }
}
window.addEventListener('hashchange', render);

function viewCatalog(slug, catId){
  uiFilters.cat = catId;
  const store = PUBLIC_STORE, cats = PUBLIC_CATS;
  let items = [...PUBLIC_PRODS];
  if(uiFilters.favOnly) items = items.filter(p=>isFav(slug, p.id));
  if(catId && catId!=='all') items = items.filter(p=>p.category_id===catId);
  if(uiFilters.q.trim()){
    const q = uiFilters.q.trim().toLowerCase();
    items = items.filter(p=> p.name.toLowerCase().includes(q) || (p.short_desc||'').toLowerCase().includes(q) || (p.sku||'').toLowerCase().includes(q));

  if(uiFilters.sort==='price-asc') items.sort((a,b)=>effPrice(a)-effPrice(b));
  else if(uiFilters.sort==='price-desc') items.sort((a,b)=>effPrice(b)-effPrice(a));

  else items.sort((a,b)=>(b.featured?1:0)-(a.featured?1:0) || a.sort_order-b.sort_order);

  const catObj = catId && catId!=='all' ? cats.find(c=>c.id===catId) : null;
  const title = uiFilters.favOnly ? 'Seus favoritos' : catObj ? `${catObj.icon} ${catObj.name}` : 'Todos os produtos';

async function viewProduct(slug, id){
  viewLoadingFull();
  try{
    let store = PUBLIC_STORE && PUBLIC_STORE.slug===slug ? PUBLIC_STORE : await dbGetStoreBySlug(slug);
    if(!store){ view404(); return; }
    applyBrandColors(store.primary_color, store.secondary_color);
    const [cats, prods] = await Promise.all([dbGetCategories(store.id), dbGetProducts(store.id)]);
    PUBLIC_STORE = store; PUBLIC_CATS = cats; PUBLIC_PRODS = prods.filter(p=>!p.hidden);
    const p = prods.find(x=>x.id===id);
    if(!p){ view404(); return; }
    dbLogEvent(store.id, 'product_view', id);

async function doCheckout(slug){
  const store = PUBLIC_STORE;
  const prods = PUBLIC_PRODS;
  const cart = getCart(slug);
  if(!cart.length){ toast('Seu carrinho está vazio.', 'error'); return; }
  const name = $('#ck-name') ? $('#ck-name').value : '';
  const delivery = ($('input[name="delivery"]:checked')||{}).value || 'Entrega';
  const notes = $('#ck-notes') ? $('#ck-notes').value : '';
  const total = cartTotal(slug, prods);
  const msg = buildWhatsAppMessage(store, prods, cart, name, delivery, notes);
  const url = `https://wa.me/${(store.whatsapp||'').replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`;
  try{
    await dbCreateOrder({
      store_id: store.id, customer_name: name||'Não informado', delivery, notes,
      items: cart.map(l=>{ const p=prods.find(x=>x.id===l.id); return {id:l.id, name:p?p.name:'', qty:l.qty, price:p?effPrice(p):0}; }),
      total, status:'Novo'
    });
    dbLogEvent(store.id, 'whatsapp_click', null);
  }catch(e){ console.error('Falha ao registrar pedido (não bloqueia o checkout):', e); }
  clearCart(slug);
  window.open(url, '_blank', 'noopener');
  toast('Pedido enviado! Abrindo o WhatsApp…', 'success');
  navigate('/loja/'+slug);
}

async function finishStoreCreation({storeName, ownerName, email, withSample}){
  let slug = slugify(storeName);
  let attempt = 0;
  while(!(await dbSlugAvailable(slug))){ attempt++; slug = slugify(storeName)+'-'+(attempt+1); if(attempt>20) { slug = slugify(storeName)+'-'+Date.now(); break; } }
  const store = await dbCreateStore({
    user_id: SESSION.user.id, slug, name: storeName, email: email||SESSION.user.email,
  });
  MY_STORE = store;
  if(withSample){ await seedSampleData(store.id); }
  toast(`Loja "${storeName}" criada! Bem-vindo(a) à Vitrina.`, 'success');
  navigate('/admin/dashboard');
}

/* ---------------- GRÁFICOS SVG SIMPLES ---------------- */
function svgBarsRow(data, opts){
  const color = (opts&&opts.color)||'var(--accent)';
  const max = Math.max(1, ...data.map(d=>d.value));
  return data.map(d=>`<div class="bar-row"><span class="bl" title="${esc(d.label)}">${esc(d.label)}</span>
    <div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,(d.value/max)*100)}%;background:${color};"></div></div>
    <span class="bar-val tnum">${d.value}</span></div>`).join('');
}
function svgDonut(segments, opts){
  opts = opts||{};
  const size = opts.size||140, stroke=opts.stroke||22, r=(size-stroke)/2, c=size/2;
  const total = Math.max(1, segments.reduce((s,d)=>s+d.value,0));
  let offset=0;
  const circumference = 2*Math.PI*r;
  const circles = segments.map(seg=>{
    const frac = seg.value/total;
    const dash = frac*circumference;
    const el = `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${stroke}" stroke-dasharray="${dash.toFixed(1)} ${(circumference-dash).toFixed(1)}" stroke-dashoffset="${(-offset).toFixed(1)}" transform="rotate(-90 ${c} ${c})"/>`;
    offset += dash;
    return el;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="Gráfico de proporção">
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--surface-alt)" stroke-width="${stroke}"/>${circles}
    <text x="${c}" y="${c+5}" text-anchor="middle" font-size="17" font-weight="700" fill="var(--text)" font-family="IBM Plex Mono, monospace">${total}</text>
  </svg>`;
}

}
async function viewAdminDashboard(){
  viewLoadingFull();
  try{
    await loadAdminData();
    const prods = ADMIN_PRODS, orders = ADMIN_ORDERS, events = ADMIN_EVENTS;
    const total = prods.length;
    const disponiveis = prods.filter(p=>!p.hidden && p.stock>0).length;
    const semEstoque = prods.filter(p=>p.stock<=0).length;
    const ocultos = prods.filter(p=>p.hidden).length;
    const totalEstimado = orders.reduce((s,o)=>s+Number(o.total),0);
    const ticketMedio = orders.length ? totalEstimado/orders.length : 0;
    const whatsappClicks = events.filter(e=>e.event_type==='whatsapp_click').length;

    const cartAddsCount = {};
    events.filter(e=>e.event_type==='cart_add' && e.product_id).forEach(e=>{ cartAddsCount[e.product_id]=(cartAddsCount[e.product_id]||0)+1; });
    const cartAddsSorted = Object.entries(cartAddsCount).sort((a,b)=>b[1]-a[1]).slice(0,5)
      .map(([id,val])=>({label:(prods.find(p=>p.id===id)||{}).name||'—', value:val}));

    const donutData = [
      {label:'Disponíveis', value:disponiveis, color:'var(--success)'},
      {label:'Sem estoque', value:semEstoque, color:'var(--danger)'},
      {label:'Ocultos', value:ocultos, color:'var(--text-faint)'},
    ];
    const visits = events.filter(e=>e.event_type==='catalog_visit').length;

    adminShell('dashboard', 'Dashboard', `
      <div class="kpi-grid">
        <div class="card kpi-card"><span class="kpi-label">Produtos cadastrados</span><span class="kpi-value tnum">${total}</span><span class="kpi-sub">em ${ADMIN_CATS.length} categorias</span></div>
        <div class="card kpi-card"><span class="kpi-label">Disponíveis</span><span class="kpi-value tnum" style="color:var(--success);">${disponiveis}</span><span class="kpi-sub">visíveis no catálogo</span></div>
        <div class="card kpi-card"><span class="kpi-label">Sem estoque</span><span class="kpi-value tnum" style="color:var(--danger);">${semEstoque}</span><span class="kpi-sub">precisam de reposição</span></div>
        <div class="card kpi-card"><span class="kpi-label">Ocultos</span><span class="kpi-value tnum">${ocultos}</span><span class="kpi-sub">fora do catálogo público</span></div>
        <div class="card kpi-card"><span class="kpi-label">Pedidos iniciados</span><span class="kpi-value tnum">${orders.length}</span><span class="kpi-sub">via catálogo → WhatsApp</span></div>
        <div class="card kpi-card"><span class="kpi-label">Total estimado</span><span class="kpi-value tnum">${fmtBRL(totalEstimado)}</span><span class="kpi-sub">soma dos pedidos enviados</span></div>
        <div class="card kpi-card"><span class="kpi-label">Ticket médio</span><span class="kpi-value tnum">${fmtBRL(ticketMedio)}</span><span class="kpi-sub">por pedido</span></div>
        <div class="card kpi-card"><span class="kpi-label">Acessos ao catálogo</span><span class="kpi-value tnum">${visits}</span><span class="kpi-sub">${whatsappClicks} cliques no WhatsApp</span></div>
      </div>
      <div class="panel-grid">
        <div class="card panel"><h3>Produtos mais adicionados ao carrinho</h3><p class="panel-sub">Desde a criação da loja</p>
          ${cartAddsSorted.length ? svgBarsRow(cartAddsSorted) : `<div class="empty-mini">Ainda sem dados suficientes.</div>`}
        </div>
        <div class="card panel"><h3>Status dos produtos</h3><p class="panel-sub">Distribuição atual do catálogo</p>
          <div style="display:flex;align-items:center;gap:20px;">${svgDonut(donutData)}
            <ul class="chart-legend" style="flex-direction:column;">${donutData.map(d=>`<li><span class="sw" style="background:${d.color}"></span>${d.label} — ${d.value}</li>`).join('')}</ul>
          </div>
        </div>
      </div>
      ${!total ? `<div class="card panel" style="text-align:center;padding:40px;"><h3>Sua loja está vazia</h3><p class="panel-sub">Cadastre seu primeiro produto para começar a divulgar.</p><a class="btn btn-primary" href="#/admin/produtos/novo" style="margin-top:10px;">+ Cadastrar produto</a></div>` : ''}
    `);
  }catch(e){
    mount(`<div class="wrap" style="padding:80px 0;text-align:center;"><h2>Não consegui carregar o dashboard</h2><p style="color:var(--text-muted);">${esc(friendlyError(e))}</p></div>`);
  }
}

function renderAdminProducts(){

  if(prodFilters.cat!=='all') items = items.filter(p=>p.category_id===prodFilters.cat);
  if(prodFilters.status==='available') items = items.filter(p=>!p.hidden && p.stock>0);
  if(prodFilters.status==='out') items = items.filter(p=>p.stock<=0);
  if(prodFilters.status==='hidden') items = items.filter(p=>p.hidden);
  if(prodFilters.status==='featured') items = items.filter(p=>p.featured);
  if(prodFilters.q.trim()){
    const q = prodFilters.q.trim().toLowerCase();
    items = items.filter(p=>p.name.toLowerCase().includes(q) || (p.sku||'').toLowerCase().includes(q));

      <button class="filter-chip ${prodFilters.status==='out'?'active':''}" data-action="prod-filter-status" data-v="out">Sem estoque</button>

      <select style="width:auto;padding:.4em .7em;font-size:.79rem;" data-action="prod-filter-cat">
        <option value="all">Todas as categorias</option>
        ${ADMIN_CATS.map(c=>`<option value="${c.id}" ${prodFilters.cat===c.id?'selected':''}>${c.icon} ${esc(c.name)}</option>`).join('')}
      </select>

      <table class="data-table">
        <thead><tr><th>Produto</th><th>Categoria</th><th>Preço</th><th>Estoque</th><th>Status</th><th></th></tr></thead>

              <td>${esc(catName(ADMIN_CATS,p.category_id))||'—'}</td>
              <td class="tnum">${fmtBRL(effPrice(p))}${p.promo_price!=null?' <span style="color:var(--accent-2);font-size:.72rem;">promo</span>':''}</td>
              <td class="tnum">${p.stock>90?'∞':p.stock}</td>
              <td>${p.hidden?'<span class="badge badge-neutral">Oculto</span>':p.stock<=0?'<span class="badge badge-danger">Sem estoque</span>':'<span class="badge badge-success">Disponível</span>'}${p.featured?' <span class="badge badge-accent2">Destaque</span>':''}</td>

function renderImgList(){
  const uploading = formDraftUploading ? `<div class="img-item"><div class="thumb thumb-sm skeleton"></div></div>` : '';
  if(!formDraftImages.length) return uploading;
  return formDraftImages.map((src,i)=>`

      <div class="thumb thumb-sm"><img src="${esc(src)}"></div>
      ${i===0?'<span class="primary-tag">Capa</span>':''}
      <div class="img-item-controls">
        <button type="button" data-action="img-primary" data-i="${i}" title="Definir como principal">★</button>
        <button type="button" data-action="img-remove" data-i="${i}" title="Remover">🗑</button>
      </div>
    </div>`).join('') + uploading;
}
function renderProductPreview(){
  const el = document.getElementById('pf-preview');
  if(!el) return;
  const name = $('#pf-name').value || 'Nome do produto';
  const price = parseFloat($('#pf-price').value)||0;
  const promo = $('#pf-promo').value ? parseFloat($('#pf-promo').value) : null;
  const catSel = $('#pf-cat');
  const catId = catSel ? catSel.value : '';
  const shortDesc = $('#pf-short').value || '';
  const fakeP = {id:'preview', images:formDraftImages};
  el.innerHTML = `<div class="card product-card">${thumbHtml(fakeP)}
      <div class="pc-body"><span class="pc-cat">${esc(catName(ADMIN_CATS,catId))}</span><h3 class="pc-name">${esc(name)}</h3><p class="pc-desc">${esc(shortDesc)}</p>
        <div class="pc-price-row"><span class="pc-price tnum">${fmtBRL(promo!=null?promo:price)}</span>${promo!=null?`<span class="pc-price-old tnum">${fmtBRL(price)}</span>`:''}</div>
      </div></div>`;
}

function shareLink(url, label){
  if(navigator.share){ navigator.share({title: label||'Vitrina', url}).catch(()=>{}); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(()=>toast('Link copiado para a área de transferência.', 'success')).catch(()=>toast('Link: ' + url, 'info'));
  } else { toast('Link: ' + url, 'info'); }
}
function setBusy(btn, busyLabel){ if(!btn) return; btn.dataset.originalLabel = btn.textContent; btn.textContent = busyLabel||'Enviando…'; btn.disabled = true; }
function unsetBusy(btn){ if(!btn) return; if(btn.dataset.originalLabel) btn.textContent = btn.dataset.originalLabel; btn.disabled = false; }

document.addEventListener('click', function(e){
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;
  const id = t.dataset.id;
  const slug = t.dataset.slug;

  switch(action){
    case 'header-whatsapp': {
      const url = `https://wa.me/${(PUBLIC_STORE.whatsapp||'').replace(/\D/g,'')}?text=${encodeURIComponent('Olá! Vim pelo catálogo online e gostaria de mais informações.')}`;
      dbLogEvent(PUBLIC_STORE.id, 'whatsapp_click', null);
      window.open(url, '_blank', 'noopener');
      break;
    }
    case 'header-share': shareLink(location.href.replace(/#.*$/, '') + '#/loja/'+slug, PUBLIC_STORE.name); break;
    case 'toggle-fav-filter': uiFilters.favOnly = !uiFilters.favOnly; viewCatalog(slug, uiFilters.cat); break;
    case 'go-cat': navigate(t.dataset.cat==='all' ? '/loja/'+slug : '/loja/'+slug+'/categoria/'+t.dataset.cat); break;
    case 'toggle-fav': toggleFav(slug, id); t.classList.toggle('is-fav'); t.classList.toggle('is-active'); t.textContent = isFav(slug,id) ? '❤' : '🤍'; break;
    case 'add-cart': addToCart(slug, PUBLIC_PRODS, id, 1); break;
    case 'pd-thumb': {
      $('#pd-main-img').src = t.dataset.src;
      $all('.pd-gallery-thumbs .thumb').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      break;
    }
    case 'pd-qty-dec': { const inp=$('#pd-qty'); inp.value = Math.max(1, parseInt(inp.value)-1); break; }
    case 'pd-qty-inc': { const inp=$('#pd-qty'); inp.value = parseInt(inp.value)+1; break; }
    case 'pd-add-cart': { const qty = parseInt($('#pd-qty').value)||1; addToCart(slug, PUBLIC_PRODS, id, qty); break; }
    case 'share-product': shareLink(location.href.replace(/#.*$/, '') + '#/loja/'+slug+'/produto/'+id, ''); break;
    case 'clear-cart': clearCart(slug); render(); break;
    case 'cart-qty-dec': { const cart=getCart(slug); const l=cart.find(x=>x.id===id); if(l){ if(l.qty<=1){ removeFromCart(slug,id); } else { setCartQty(slug, PUBLIC_PRODS, id, l.qty-1); } viewCart(slug); } break; }
    case 'cart-qty-inc': { const cart=getCart(slug); const l=cart.find(x=>x.id===id); if(l){ setCartQty(slug, PUBLIC_PRODS, id, l.qty+1); viewCart(slug); } break; }
    case 'cart-remove': removeFromCart(slug, id); viewCart(slug); break;
    case 'checkout-whatsapp': doCheckout(slug); break;

    case 'admin-logout': authSignOut().then(()=>{ MY_STORE=null; navigate('/admin/login'); }); break;
    case 'toggle-sidebar': $('#admin-sidebar').classList.toggle('open'); break;
    case 'toggle-switch': t.classList.toggle('on'); break;
    case 'copy-store-link': shareLink(location.origin+location.pathname+'#/loja/'+MY_STORE.slug, MY_STORE.name); break;

    case 'prod-filter-status': prodFilters.status = t.dataset.v; renderAdminProducts(); break;
    case 'prod-duplicate': {
      const p = ADMIN_PRODS.find(x=>x.id===id); if(!p) break;
      const copy = Object.assign({}, p); delete copy.id; delete copy.created_at; delete copy.updated_at;
      copy.name = p.name+' (cópia)'; copy.sku = (p.sku||'')+'-COPY'; copy.sort_order = ADMIN_PRODS.length+1;
      dbCreateProduct(copy).then(newP=>{ ADMIN_PRODS.push(newP); toast('Produto duplicado.', 'success'); renderAdminProducts(); })
        .catch(err=>toast(friendlyError(err), 'error'));
      break;
    }
    case 'prod-toggle-hide': {
      const p = ADMIN_PRODS.find(x=>x.id===id); if(!p) break;
      dbUpdateProduct(id, {hidden: !p.hidden}).then(updated=>{ p.hidden = updated.hidden; toast(p.hidden?'Produto ocultado do catálogo.':'Produto visível no catálogo.', 'info'); renderAdminProducts(); })
        .catch(err=>toast(friendlyError(err), 'error'));
      break;
    }
    case 'prod-delete': confirmModal('Excluir produto?', 'Essa ação não pode ser desfeita.', ()=>{
      dbDeleteProduct(id).then(()=>{ ADMIN_PRODS = ADMIN_PRODS.filter(p=>p.id!==id); toast('Produto excluído.', 'success'); renderAdminProducts(); })
        .catch(err=>toast(friendlyError(err), 'error'));
    }); break;
    case 'trigger-upload': $('#pf-images').click(); break;
    case 'img-primary': { const i=parseInt(t.dataset.i); const [im]=formDraftImages.splice(i,1); formDraftImages.unshift(im); $('#pf-img-list').innerHTML = renderImgList(); renderProductPreview(); break; }
    case 'img-remove': { const i=parseInt(t.dataset.i); formDraftImages.splice(i,1); $('#pf-img-list').innerHTML = renderImgList(); renderProductPreview(); break; }

    case 'cat-new': categoryModal(null); break;
    case 'cat-edit': categoryModal(ADMIN_CATS.find(c=>c.id===id)); break;
    case 'cat-order-up': moveCategory(id,-1); break;
    case 'cat-order-down': moveCategory(id,1); break;
    case 'cat-delete': {
      const inUse = ADMIN_PRODS.some(p=>p.category_id===id);
      if(inUse){ toast('Não é possível excluir: há produtos nesta categoria.', 'error'); break; }
      confirmModal('Excluir categoria?', 'Essa ação não pode ser desfeita.', ()=>{
        dbDeleteCategory(id).then(()=>{ ADMIN_CATS = ADMIN_CATS.filter(c=>c.id!==id); toast('Categoria excluída.', 'success'); renderAdminCategories(); })
          .catch(err=>toast(friendlyError(err), 'error'));
      });
      break;
    }
    case 'modal-close': closeModal(); break;
    case 'modal-close-bg': if(e.target===t) closeModal(); break;
    case 'toggle-autohide': {
      t.classList.toggle('on');
      const val = t.classList.contains('on');
      dbUpdateStore(MY_STORE.id, {auto_hide_out_of_stock: val}).then(updated=>{ MY_STORE.auto_hide_out_of_stock = updated.auto_hide_out_of_stock; toast('Preferência atualizada.', 'success'); })
        .catch(err=>{ t.classList.toggle('on'); toast(friendlyError(err), 'error'); });
      break;
    }
  }
});

async function moveCategory(id, dir){
  const cats = [...ADMIN_CATS].sort((a,b)=>a.sort_order-b.sort_order);
  const idx = cats.findIndex(c=>c.id===id);
  const swapIdx = idx+dir;
  if(swapIdx<0 || swapIdx>=cats.length) return;
  const a = cats[idx], b = cats[swapIdx];
  const tmp = a.sort_order; a.sort_order = b.sort_order; b.sort_order = tmp;
  try{
    await Promise.all([dbUpdateCategory(a.id,{sort_order:a.sort_order}), dbUpdateCategory(b.id,{sort_order:b.sort_order})]);
    renderAdminCategories();
  }catch(err){ toast(friendlyError(err), 'error'); }
}

document.addEventListener('submit', async function(e){
  const t = e.target.closest('[data-action]');
  if(!t) return;
  e.preventDefault();
  const action = t.dataset.action;
  const submitBtn = t.querySelector('button[type=submit]');
  try{
    switch(action){
      case 'form-login': {
        setBusy(submitBtn, 'Entrando…');
        const {session} = await authSignIn($('#lg-email').value.trim(), $('#lg-pass').value);
        SESSION = session;
        MY_STORE = await dbGetMyStore(session.user.id);
        toast('Bem-vindo(a) de volta!', 'success');
        navigate(MY_STORE ? '/admin/dashboard' : '/admin/completar-cadastro');
        break;
      }
      case 'form-signup': {
        const storeName = $('#su-store').value.trim();
        const ownerName = $('#su-owner').value.trim();
        const email = $('#su-email').value.trim();
        const pass = $('#su-pass').value;
        const withSample = $('#sw-sample').classList.contains('on');
        if(!storeName || !ownerName || !email || pass.length<6){ toast('Preencha todos os campos (senha com 6+ caracteres).', 'error'); return; }
        setBusy(submitBtn, 'Criando conta…');
        const {session} = await authSignUp(email, pass);
        if(session){
          SESSION = session;
          await finishStoreCreation({storeName, ownerName, email, withSample});
        } else {
          stashPendingStore(email, {storeName, ownerName, email, withSample});
          mount(`<div class="auth-shell"><div class="card auth-card">
            <div class="auth-logo"><span class="dot"></span>Vitrina</div>
            <h2>Confirme seu e-mail</h2>
            <p class="sub">Enviamos um link de confirmação para <b>${esc(email)}</b>. Clique nele e depois volte para fazer login — sua loja "${esc(storeName)}" será criada automaticamente.</p>
            <a class="btn btn-primary btn-block" href="#/admin/login">Ir para o login</a>
          </div></div>`);
        }
        break;
      }
      case 'form-complete-signup': {
        const storeName = $('#cs-store').value.trim();
        const ownerName = $('#cs-owner').value.trim();
        if(!storeName || !ownerName){ toast('Preencha os dois campos.', 'error'); return; }
        setBusy(submitBtn, 'Criando loja…');
        await finishStoreCreation({storeName, ownerName, email: SESSION.user.email, withSample:true});
        break;
      }
      case 'form-recover': {
        setBusy(submitBtn, 'Enviando…');
        await authRequestReset($('#rc-email').value.trim());
        toast('Se este e-mail existir, enviamos um link de recuperação.', 'success');
        navigate('/admin/login');
        break;
      }
      case 'form-new-password': {
        setBusy(submitBtn, 'Salvando…');
        await authUpdatePassword($('#np-pass').value);
        toast('Senha atualizada com sucesso!', 'success');
        MY_STORE = await dbGetMyStore(SESSION.user.id);
        navigate(MY_STORE ? '/admin/dashboard' : '/admin/completar-cadastro');
        break;
      }
      case 'form-product': {
        setBusy(submitBtn, 'Salvando…');
        const editing = !!t.dataset.id;
        const catSel = $('#pf-cat');
        const data = {
          name: $('#pf-name').value.trim(), sku: $('#pf-sku').value.trim(),
          category_id: catSel && catSel.value ? catSel.value : null,
          short_desc: $('#pf-short').value.trim(), full_desc: $('#pf-full').value.trim(),
          price: parseFloat($('#pf-price').value)||0,
          promo_price: $('#pf-promo').value ? parseFloat($('#pf-promo').value) : null,
          stock: parseInt($('#pf-stock').value)||0, sort_order: parseInt($('#pf-order').value)||1,
          featured: $('#sw-featured').classList.contains('on'), is_new: $('#sw-new').classList.contains('on'),
          hidden: $('#sw-hidden').classList.contains('on'), images: [...formDraftImages],
        };
        if(!data.name){ toast('Informe o nome do produto.', 'error'); unsetBusy(submitBtn); return; }
        if(editing){ await dbUpdateProduct(t.dataset.id, data); toast('Produto atualizado.', 'success'); }
        else { data.store_id = MY_STORE.id; await dbCreateProduct(data); toast('Produto publicado no catálogo.', 'success'); }
        navigate('/admin/produtos');
        break;
      }
      case 'form-category': {
        const name = $('#cm-name').value.trim(), icon = $('#cm-icon').value.trim()||'🏷️';
        if(!name){ toast('Informe o nome da categoria.', 'error'); return; }
        if(t.dataset.id){ await dbUpdateCategory(t.dataset.id, {name, icon}); const c=ADMIN_CATS.find(x=>x.id===t.dataset.id); if(c){c.name=name;c.icon=icon;} }
        else { const created = await dbCreateCategory(MY_STORE.id, name, icon, ADMIN_CATS.length+1); ADMIN_CATS.push(created); }
        closeModal(); toast('Categoria salva.', 'success'); renderAdminCategories();
        break;
      }
      case 'form-settings': {
        setBusy(submitBtn, 'Salvando…');
        const patch = {
          name: $('#cf-name').value.trim() || MY_STORE.name, tagline: $('#cf-tagline').value.trim(),
          description: $('#cf-desc').value.trim(), whatsapp: $('#cf-wpp').value.replace(/\D/g,''),
          email: $('#cf-email').value.trim(), instagram: $('#cf-insta').value.trim(), address: $('#cf-addr').value.trim(),
        };
        MY_STORE = await dbUpdateStore(MY_STORE.id, patch);
        toast('Configurações salvas.', 'success'); viewAdminSettings();
        break;
      }
      case 'form-personalization': {
        setBusy(submitBtn, 'Salvando…');
        const patch = { primary_color: $('#pz-primary').value, secondary_color: $('#pz-secondary').value, banner_text: $('#pz-banner').value.trim(), welcome_text: $('#pz-welcome').value.trim() };
        MY_STORE = await dbUpdateStore(MY_STORE.id, patch);
        applyBrandColors(MY_STORE.primary_color, MY_STORE.secondary_color);
        toast('Personalização salva.', 'success'); viewAdminPersonalization();
        break;
      }
    }
  }catch(err){
    unsetBusy(submitBtn);
    toast(friendlyError(err), 'error');
    return;
  }
});

document.addEventListener('input', function(e){
  const t = e.target;
  if(t.dataset && t.dataset.action==='search-input'){ uiFilters.q = t.value; clearTimeout(window.__searchTO); window.__searchTO = setTimeout(()=>viewCatalog(t.dataset.slug, uiFilters.cat), 180); }
  if(t.id==='prod-search'){ prodFilters.q = t.value; clearTimeout(window.__psearchTO); window.__psearchTO = setTimeout(renderAdminProducts, 180); }
});
document.addEventListener('change', async function(e){
  const t = e.target;
  if(t.dataset && t.dataset.action==='sort-select'){ uiFilters.sort = t.value; viewCatalog(t.dataset.slug, uiFilters.cat); }
  if(t.dataset && t.dataset.action==='prod-filter-cat'){ prodFilters.cat = t.value; renderAdminProducts(); }
  if(t.dataset && t.dataset.action==='update-stock'){
    const p = ADMIN_PRODS.find(x=>x.id===t.dataset.id);
    const newStock = Math.max(0, parseInt(t.value)||0);
    try{ await dbUpdateProduct(t.dataset.id, {stock:newStock}); p.stock = newStock; toast('Estoque atualizado.', 'success'); renderAdminStock(); }
    catch(err){ toast(friendlyError(err), 'error'); }
  }
  if(t.id==='low-threshold'){
    const val = Math.max(0, parseInt(t.value)||0);
    try{ MY_STORE = await dbUpdateStore(MY_STORE.id, {low_stock_threshold: val}); }catch(err){ toast(friendlyError(err), 'error'); }
  }
  if(t.id==='pf-images'){
    const files = Array.from(t.files||[]).filter(f=>f.size <= 5*1024*1024);
    if(Array.from(t.files||[]).some(f=>f.size > 5*1024*1024)) toast('Alguma imagem passou de 5MB e foi ignorada.', 'error');
    if(!files.length){ t.value=''; return; }
    formDraftUploading = true;
    const listEl = $('#pf-img-list'); if(listEl) listEl.innerHTML = renderImgList();
    try{
      for(const file of files){
        const url = await dbUploadImage(SESSION.user.id, file);
        formDraftImages.push(url);
      }
    }catch(err){ toast(friendlyError(err), 'error'); }
    formDraftUploading = false;
    if(listEl){ listEl.innerHTML = renderImgList(); }
    renderProductPreview();
    t.value = '';
  }
});

/* ---------------- INICIALIZAÇÃO ---------------- */
async function init(){
  if(!SUPABASE_READY){
    mount(`<div class="wrap" style="padding:80px 0;text-align:center;"><h2>Não consegui carregar</h2><p style="color:var(--text-muted);margin:10px 0;">Verifique sua conexão com a internet e recarregue a página.</p></div>`);
    return;
  }
  resetBrandColors();
  sb.auth.onAuthStateChange((event, session)=>{
    SESSION = session;
    if(event === 'PASSWORD_RECOVERY'){
      history.replaceState(null, '', location.pathname + location.search + '#/admin/nova-senha');
      render();
    }
  });
  try{
    const {data} = await sb.auth.getSession();
    SESSION = data.session;
    if(SESSION){
      try{ MY_STORE = await dbGetMyStore(SESSION.user.id); }catch(e){ console.error('Falha ao carregar loja:', e); }
    }
  }catch(e){ console.error('Falha ao obter sessão:', e); }
  if(!location.hash || location.hash==='#') location.hash = '#/';
  render();
}
init();
</script>
